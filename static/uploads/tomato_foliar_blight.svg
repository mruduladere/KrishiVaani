<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafc" rx="16"/>
  <!-- Tomato Stem / Rachis -->
  <path d="M200,380 Q195,280 200,180 Q205,100 200,40" stroke="#4d7c0f" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Tomato Serrated Leaflets (Compound Leaf) -->
  <g filter="url(#shadow)">
    <!-- Terminal Leaflet -->
    <path d="M200,140 C170,120 150,70 200,30 C250,70 230,120 200,140 Z" fill="#3f6212" stroke="#1a2e05" stroke-width="2.5"/>
    <path d="M200,135 L200,40" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Terminal Leaflet Spots (Concentric Target Rings) -->
    <ellipse cx="190" cy="70" rx="12" ry="10" fill="#713f12" opacity="0.9"/>
    <ellipse cx="190" cy="70" rx="8" ry="6" fill="#451a03"/>
    <circle cx="190" cy="70" r="3" fill="#1c1917"/>
    <circle cx="190" cy="70" r="14" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.8"/>

    <!-- Left Upper Leaflet -->
    <path d="M190,170 C140,160 90,130 90,90 C130,90 170,130 190,170 Z" fill="#3f6212" stroke="#1a2e05" stroke-width="2.5"/>
    <path d="M190,170 L105,100" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="135" cy="115" rx="10" ry="8" fill="#713f12" opacity="0.9"/>
    <circle cx="135" cy="115" r="5" fill="#451a03"/>
    <circle cx="135" cy="115" r="11" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.75"/>

    <!-- Right Upper Leaflet -->
    <path d="M210,170 C260,160 310,130 310,90 C270,90 230,130 210,170 Z" fill="#3f6212" stroke="#1a2e05" stroke-width="2.5"/>
    <path d="M210,170 L295,100" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="265" cy="115" rx="9" ry="7" fill="#713f12" opacity="0.9"/>
    <circle cx="265" cy="115" r="4" fill="#451a03"/>
    <circle cx="265" cy="115" r="10" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.75"/>

    <!-- Left Lower Leaflet (Older Leaf - Heavier Infection) -->
    <path d="M185,250 C120,240 60,210 50,160 C100,160 150,210 185,250 Z" fill="#4d7c0f" stroke="#1a2e05" stroke-width="2.5"/>
    <path d="M185,250 L65,175" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Concentric Rings on Older Leaflet -->
    <ellipse cx="110" cy="195" rx="16" ry="12" fill="#713f12" opacity="0.95"/>
    <ellipse cx="110" cy="195" rx="11" ry="8" fill="#451a03"/>
    <ellipse cx="110" cy="195" rx="6" ry="4" fill="#1c1917"/>
    <ellipse cx="110" cy="195" rx="19" ry="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.85"/>
    <ellipse cx="75" cy="175" rx="10" ry="7" fill="#713f12" opacity="0.9"/>
    <circle cx="75" cy="175" r="4" fill="#451a03"/>

    <!-- Right Lower Leaflet -->
    <path d="M215,250 C280,240 340,210 350,160 C300,160 250,210 215,250 Z" fill="#4d7c0f" stroke="#1a2e05" stroke-width="2.5"/>
    <path d="M215,250 L335,175" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="290" cy="195" rx="15" ry="11" fill="#713f12" opacity="0.95"/>
    <ellipse cx="290" cy="195" rx="10" ry="7" fill="#451a03"/>
    <ellipse cx="290" cy="195" rx="18" ry="14" fill="none" stroke="#eab308" stroke-width="2" opacity="0.85"/>
  </g>
  <!-- Badges -->
  <rect x="16" y="16" width="165" height="28" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="98" y="35" fill="#854d0e" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Target Rings / Spots</text>
  <rect x="235" y="16" width="148" height="28" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="309" y="35" fill="#991b1b" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Tomato Foliar Blight</text>
</svg>